name: Deploy Tasks 

on:
  push:
    branches:
      - hw-04

env:
  # Carpeta donde se genera el build de Vite
  SOURCE_DIR: './tasks-app/dist'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      
      - name: Checkout
        uses: actions/checkout@v3

    
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

    
      - name: Install dependencies
        run: npm install
        working-directory: ./tasks-app

     
      - name: Build project
        run: npm run build
        working-directory: ./tasks-app

    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-2' # Cambiar a tu región si es diferente

    
      - name: Sync files to S3
        run: |
          aws s3 sync ${{ env.SOURCE_DIR }} s3://${{ secrets.AWS_BUCKET }}/ --delete


      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

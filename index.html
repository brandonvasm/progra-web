<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="informacion">
        <h1 class="logo">facebook </h1>
        <p class="descripcion">Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
        <div class="login">
            <form class="formulario">
                <input type="text" placeholder="Correo electrónico o número de teléfono">
                <input type="password" placeholder="Contraseña">
                <button type="submit" class="btn-login">Iniciar sesión</button>
                <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
                <hr>
                <button type="button" class="btn-crear-cuenta">Crear cuenta nueva</button>
            </form>
        </div>
        <p class="texto-final">
            <b>Crea una página</b> para una celebridad, una marca o un <br> negocio.
        </p>

        <meta name="theme-color" content="#1877f2">
        
    </div>
   

    
</body>
</html>

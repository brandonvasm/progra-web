version: "3.9"

services:
  db:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      timeout: 5s

  web:
    build: .
    command: >
      sh -c "while ! pg_isready -h db -U $${POSTGRES_USER}; do sleep 1; done &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/home/appuser/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
